org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
android.useAndroidX=true

# The Onyx SDK AARs still bundle pre-AndroidX support classes. Without jetifier
# they land in the app as a second, incompatible copy of the support library and
# the merge fails. This is the single line that most distinguishes this build
# from the Supernote one, where the SDK is already AndroidX and jetifier is off.
android.enableJetifier=true

kotlin.code.style=official
